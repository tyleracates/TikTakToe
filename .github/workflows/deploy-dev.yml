name: Deploy to Dev

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write  # Required for OIDC workload identity federation

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Azure Static Web Apps (dev)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: upload
          app_location: /
          output_location: dist

      - name: Smoke test (dev)
        run: |
          echo "Waiting for deployment to settle..."
          sleep 10
          # Replace with actual dev SWA URL once configured
          # curl --fail --silent --show-error ${{ vars.DEV_URL }}
          echo "Smoke test placeholder - configure DEV_URL variable to enable"
