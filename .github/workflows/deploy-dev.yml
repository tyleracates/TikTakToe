name: Deploy to Dev

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for OIDC workload identity federation

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preflight config check (dev)
        env:
          DEV_URL: ${{ vars.DEV_URL }}
          DEV_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
        run: |
          if [[ -z "$DEV_URL" ]]; then
            echo "::error::Missing environment variable DEV_URL in GitHub Environment 'dev'."
            exit 1
          fi
          if [[ -z "$DEV_TOKEN" ]]; then
            echo "::error::Missing secret AZURE_STATIC_WEB_APPS_API_TOKEN_DEV in GitHub Environment 'dev'."
            exit 1
          fi

      - name: Deploy to Azure Static Web Apps (dev)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: upload
          app_location: /
          output_location: dist

      - name: Smoke test (dev)
        run: |
          echo "Waiting for deployment to settle..."
          sleep 10
          curl --fail --silent --show-error "${{ vars.DEV_URL }}"
