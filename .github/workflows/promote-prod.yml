name: Promote to Production

on:
  schedule:
    - cron: "0 10 * * 4"  # Thursday 10:00 UTC (1 week after RC selection)
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch currently deployed to preprod (e.g. release/2026.W17.3)"
        required: false

permissions:
  contents: write  # Required for git tag push
  id-token: write  # Required for OIDC

jobs:
  promote-prod:
    name: Promote Preprod to Production
    runs-on: ubuntu-latest
    environment: prod  # Requires human approval (configure in GitHub Settings)

    steps:
      - name: Resolve release branch
        id: resolve
        run: |
          if [[ -n "${{ inputs.release_branch }}" ]]; then
            BRANCH="${{ inputs.release_branch }}"
            echo "Using manually specified release branch: ${BRANCH}"
          else
            YEAR=$(date -u -d '7 days ago' +%Y)
            WEEK=$(date -u -d '7 days ago' +%V)
            BRANCH=""
            for DOW in 3 2 1; do
              CANDIDATE="release/${YEAR}.W${WEEK}.${DOW}"
              if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "${CANDIDATE}" > /dev/null 2>&1; then
                BRANCH="${CANDIDATE}"
                echo "Auto-selected prior-week release branch: ${BRANCH}"
                break
              fi
            done
            if [[ -z "${BRANCH}" ]]; then
              echo "::error::No prior-week release branches found for ${YEAR}.W${WEEK}."
              exit 1
            fi
          fi
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build is clean
        run: |
          npm run lint
          npx tsc --noEmit
          npm run build

      - name: Preflight config check (prod)
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          PROD_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
        run: |
          if [[ -z "$PROD_URL" ]]; then
            echo "::error::Missing environment variable PROD_URL in GitHub Environment 'prod'."
            exit 1
          fi
          if [[ -z "$PROD_TOKEN" ]]; then
            echo "::error::Missing secret AZURE_STATIC_WEB_APPS_API_TOKEN_PROD in GitHub Environment 'prod'."
            exit 1
          fi

      - name: Deploy to Azure Static Web Apps (prod) via SWA CLI
        env:
          PROD_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
        run: |
          npx --yes @azure/static-web-apps-cli deploy ./dist --deployment-token "$PROD_TOKEN" --env production

      - name: Smoke test (prod)
        run: |
          echo "Waiting for deployment to settle..."
          sleep 10
          curl --fail --silent --show-error "${{ vars.PROD_URL }}"

      - name: Tag production release
        run: |
          BRANCH="${{ steps.resolve.outputs.branch }}"
          SHA=$(git rev-parse HEAD)
          TAG="prod-${BRANCH#release/}-${SHA:0:7}"
          git push origin "HEAD:refs/tags/${TAG}"
          echo "✅ Production release from '${BRANCH}' — tagged as '${TAG}'"
